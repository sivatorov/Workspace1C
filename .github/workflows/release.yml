# =============================================================================
# Публикация релиза Workspace 1C в GitHub Releases.
#
# Подход к выпуску: ОДНА основная программа с модулями ПРО внутри. Модули 2.x
# компилируются в бинарь (символ PRO_MODULES), но закрыты лицензией: без ключа
# пункты видны с отметкой « · ПРО», после активации функции доступны сразу, без
# перезапуска. Отдельной «публичной» сборки в релизах нет.
#
# Срабатывает на push тега релиза (например v1.0.0.0 или 1.0.0.0):
#   1) windows — собирает один исполняемый файл Windows (WPF, net10.0-windows,
#      win-x64) скриптом build-windows-single-file.ps1 → Workspace1C.exe;
#   2) linux   — собирает один исполняемый файл Linux (Avalonia, net10.0,
#      linux-x64) скриптом build-linux-single-file.sh → Workspace1C-linux-x64;
#   3) release — создаёт (или обновляет) GitHub Release по тегу и прикрепляет
#      оба файла. Текст релиза берётся из rel_notes_<версия>.md, если он есть.
#
# Модули ПРО берутся из приватного Workspace1C.Pro по секрету PRO_REPO_TOKEN.
# Без секрета релиз не публикуется (job падает), а собранный бинарь дополнительно
# проверяется через --license-info → proModules=true.
#
# Имена asset'ов согласованы с автообновлением (Services/GitHubReleaseService.cs):
# Windows ищет «Workspace1C.exe», Linux — «Workspace1C» или имя с «linux-x64».
# =============================================================================
name: Публикация релиза

# В фильтрах тегов GitHub Actions не поддерживает символьные классы ([0-9]),
# поэтому используем glob-шаблоны: v1.0.0.0, 1.0.0.0, 1.0.0 и т.п.
on:
  push:
    tags:
      - 'v*'
      - '*.*.*'
      - '*.*.*.*'
  # Релиз, созданный через веб-интерфейс/API GitHub (тег создаётся вместе с ним).
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег релиза: существующего для пересборки или нового (например v1.0.1.7-test1)'
        required: true
      prerelease:
        description: 'Тестовая сборка: пометить релиз как prerelease (не попадёт в /releases/latest)'
        type: boolean
        default: false
      ref:
        description: 'Необязательно: ветка/коммит для сборки (по умолчанию — ветка запуска)'
        required: false
      pro_ref:
        description: 'Полный SHA коммита Workspace1C.Pro для сборки'
        required: false
      build_only:
        description: 'Только сборка и проверка запуска, без публикации релиза'
        type: boolean
        default: false

# Задания сборки читают репозиторий. Право записи получает только задание публикации.
permissions:
  contents: read

# Отменяем незавершённый прогон по тому же тегу, чтобы не плодить гонки.
concurrency:
  group: ${{ inputs.build_only && 'verify' || 'release' }}-${{ github.event.inputs.tag || github.event.release.tag_name || github.ref }}
  cancel-in-progress: true

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.event.release.tag_name || github.ref_name }}
  # Источник checkout: явный ref из workflow_dispatch (тестовая сборка из ветки),
  # иначе тег релиза, иначе ref запуска (push тега).
  CHECKOUT_REF: ${{ github.event.inputs.ref || github.event.release.tag_name || github.ref }}
  # Тестовая сборка (workflow_dispatch + prerelease=true) публикуется как prerelease:
  # GitHub /releases/latest не отдаёт prerelease, обычные пользователи не затронуты.
  IS_PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease == true }}

jobs:
  validate:
    name: Проверка входных параметров сборки
    runs-on: ubuntu-latest
    steps:
      - name: Проверка SHA и доступа к ПРО
        if: github.event_name == 'workflow_dispatch' && (inputs.build_only || inputs.pro_ref != '')
        env:
          BUILD_ONLY: ${{ inputs.build_only }}
          COMMUNITY_SHA: ${{ inputs.ref }}
          PRO_SHA: ${{ inputs.pro_ref }}
          PRO_REPO_TOKEN: ${{ secrets.PRO_REPO_TOKEN }}
        run: |
          if [[ "$BUILD_ONLY" == true && ! "$COMMUNITY_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Укажите полный SHA Workspace1C в ref."
            exit 1
          fi
          if [[ ! "$PRO_SHA" =~ ^[0-9a-fA-F]{40}$ || -z "$PRO_REPO_TOKEN" ]]; then
            echo "::error::Для сборки по заданному коммиту ПРО нужны полный SHA в pro_ref и секрет PRO_REPO_TOKEN."
            exit 1
          fi

  windows:
    name: Windows (WPF, single-file)
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      PRO_REPO_TOKEN: ${{ secrets.PRO_REPO_TOKEN }}
      ProSourceDir: ${{ github.workspace }}/pro/src/
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}

      # Модули редакции ПРО (docs/pro/PRO-EDITION.md): приватный репозиторий
      # Workspace1C.Pro, секрет PRO_REPO_TOKEN — fine-grained PAT с правом чтения.
      # Без секрета сборка падает ниже (основная программа выпускается только с ПРО).
      # При push тега pro_ref пуст — берётся ветка по умолчанию приватного репозитория;
      # для воспроизводимой сборки задавайте pro_ref (полный SHA) через workflow_dispatch.
      - name: Модули ПРО (приватный репозиторий)
        if: env.PRO_REPO_TOKEN != ''
        uses: actions/checkout@v7
        with:
          repository: sivatorov/Workspace1C.Pro
          ref: ${{ inputs.pro_ref }}
          token: ${{ env.PRO_REPO_TOKEN }}
          path: pro

      # Основная программа выпускается С модулями ПРО: они вкомпилированы, а доступ
      # к функциям 2.x закрывает лицензия. Без секрета модулей нет — такой бинарь
      # публиковать нельзя (у пользователя с ключом функции останутся недоступны).
      - name: Ошибка — сборка без модулей ПРО
        if: env.PRO_REPO_TOKEN == ''
        shell: bash
        run: |
          echo "::error title=ПРО::Секрет PRO_REPO_TOKEN не задан — сборка без модулей ПРО 2.x запрещена."
          exit 1

      - name: Установка .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Печать редакции в лог: видно, что в сборку войдут модули ПРО (модель
      # «одна программа»). Заодно страховка от «тихой» сборки публичной редакции.
      - name: Печать редакции (HasProModules)
        shell: pwsh
        run: |
          $has = (& dotnet msbuild Workspace1C/Workspace1C.csproj -nologo -getProperty:HasProModules).Trim()
          Write-Host "HasProModules=$has"
          if ($has -ne 'true') { throw "HasProModules=${has}: модули ПРО не найдены — релиз с ПРО невозможен." }

      - name: Сборка Windows single-file
        working-directory: Workspace1C
        shell: pwsh
        run: ./build-windows-single-file.ps1 -Configuration Release

      # Токен задан, но приватный репозиторий мог не скачаться или не найтись —
      # проверяем по самому бинарю, что модули ПРО действительно вошли в сборку.
      - name: Проверка модулей ПРО в Windows-бинаре
        if: env.PRO_REPO_TOKEN != ''
        shell: pwsh
        run: |
          # WPF-приложение — GUI-подсистема: stdout читаем через RedirectStandardOutput.
          $tmp = [System.IO.Path]::GetTempFileName()
          $proc = Start-Process -FilePath Workspace1C/dist/win-x64/Workspace1C.exe `
            -ArgumentList '--license-info', '--json' -NoNewWindow -Wait -PassThru `
            -RedirectStandardOutput $tmp
          $info = Get-Content $tmp -Raw | ConvertFrom-Json
          Remove-Item $tmp -Force -ErrorAction SilentlyContinue
          if ($proc.ExitCode -ne 0 -or -not $info.data.proModules) {
            throw "Windows-бинарь собран без модулей ПРО (proModules=false)."
          }
          Write-Host "Модули ПРО в Windows-бинаре: proModules=true."

      - name: Проверка запуска Windows-бинаря
        if: inputs.build_only
        shell: pwsh
        run: |
          $binary = Get-Item Workspace1C/dist/win-x64/Workspace1C.exe
          $expectedVersion = $env:RELEASE_TAG -creplace '^v', ''
          if ($binary.VersionInfo.FileVersion -ne $expectedVersion) {
            throw "Версия Windows-бинаря $($binary.VersionInfo.FileVersion), ожидается $expectedVersion."
          }
          $process = Start-Process -FilePath $binary.FullName -PassThru
          try {
            $deadline = [DateTime]::UtcNow.AddSeconds(30)
            do {
              $process.Refresh()
              if ($process.HasExited) {
                throw "Windows-бинарь завершился до открытия окна, код $($process.ExitCode)."
              }
              if ($process.MainWindowHandle -ne [IntPtr]::Zero) {
                Write-Host "Главное окно Windows открыто, версия $expectedVersion."
                break
              }
              Start-Sleep -Milliseconds 250
            } while ([DateTime]::UtcNow -lt $deadline)
            if ($process.MainWindowHandle -eq [IntPtr]::Zero) {
              throw "Главное окно Windows не открылось за 30 секунд."
            }
          } finally {
            if (!$process.HasExited) {
              Stop-Process -Id $process.Id -ErrorAction SilentlyContinue
            }
          }

      - name: Подготовка asset'а
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/release | Out-Null
          Copy-Item "Workspace1C/dist/win-x64/Workspace1C.exe" dist/release/Workspace1C.exe
          Get-ChildItem dist/release

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/release/Workspace1C.exe
          if-no-files-found: error

  linux:
    name: Linux (Avalonia, single-file)
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PRO_REPO_TOKEN: ${{ secrets.PRO_REPO_TOKEN }}
      ProSourceDir: ${{ github.workspace }}/pro/src/
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}

      # Модули редакции ПРО (docs/pro/PRO-EDITION.md): приватный репозиторий
      # Workspace1C.Pro, секрет PRO_REPO_TOKEN — fine-grained PAT с правом чтения.
      # Без секрета сборка падает ниже (основная программа выпускается только с ПРО).
      # При push тега pro_ref пуст — берётся ветка по умолчанию приватного репозитория;
      # для воспроизводимой сборки задавайте pro_ref (полный SHA) через workflow_dispatch.
      - name: Модули ПРО (приватный репозиторий)
        if: env.PRO_REPO_TOKEN != ''
        uses: actions/checkout@v7
        with:
          repository: sivatorov/Workspace1C.Pro
          ref: ${{ inputs.pro_ref }}
          token: ${{ env.PRO_REPO_TOKEN }}
          path: pro

      # Основная программа выпускается С модулями ПРО: они вкомпилированы, а доступ
      # к функциям 2.x закрывает лицензия. Без секрета модулей нет — такой бинарь
      # публиковать нельзя (у пользователя с ключом функции останутся недоступны).
      - name: Ошибка — сборка без модулей ПРО
        if: env.PRO_REPO_TOKEN == ''
        shell: bash
        run: |
          echo "::error title=ПРО::Секрет PRO_REPO_TOKEN не задан — сборка без модулей ПРО 2.x запрещена."
          exit 1

      - name: Установка .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Печать редакции в лог: видно, что в сборку войдут модули ПРО (модель
      # «одна программа»). Заодно страховка от «тихой» сборки публичной редакции.
      - name: Печать редакции (HasProModules)
        run: |
          has=$(dotnet msbuild Workspace1C/Workspace1C.csproj -nologo -getProperty:HasProModules | tr -d '[:space:]')
          echo "HasProModules=$has"
          if [[ "$has" != "true" ]]; then
            echo "::error::HasProModules=$has: модули ПРО не найдены — релиз с ПРО невозможен."
            exit 1
          fi

      # На реальном Linux скрипт собирает net10.0 + Avalonia (linux-x64),
      # выдаёт dist/linux-x64/Workspace1C — один исполняемый файл.
      - name: Сборка Linux single-file
        working-directory: Workspace1C
        run: ./build-linux-single-file.sh Release

      - name: Проверка версии Linux-сборки
        if: inputs.build_only
        working-directory: Workspace1C
        run: |
          version=$(dotnet msbuild Workspace1C.csproj -nologo -getProperty:FileVersion)
          if [[ "$version" != "${RELEASE_TAG#v}" ]]; then
            echo "::error::Версия Linux-сборки $version, ожидается ${RELEASE_TAG#v}."
            exit 1
          fi

      # Токен задан, но приватный репозиторий мог не скачаться или не найтись —
      # проверяем по самому бинарю, что модули ПРО действительно вошли в сборку.
      - name: Проверка модулей ПРО в Linux-бинаре
        if: env.PRO_REPO_TOKEN != ''
        run: |
          chmod +x Workspace1C/dist/linux-x64/Workspace1C
          out=$(./Workspace1C/dist/linux-x64/Workspace1C --license-info --json)
          echo "$out"
          echo "$out" | python3 -c "import json,sys; d=json.load(sys.stdin); raise SystemExit(0 if d['data']['proModules'] else 1)" \
            || { echo "::error::Linux-бинарь собран без модулей ПРО (proModules=false)."; exit 1; }

      # Смок-тест (issue #89, v1.0.1.24): бинарь обязан стартовать на чистой Ubuntu.
      # Ловит до публикации сбой «FileNotFoundException на старте» (например, отсутствия
      # сборки в single-file бандле) — регресс, который пользователь v1.0.1.23 увидел
      # только после установки обновления. Запускаем под xvfb на 15 секунд: GUI-приложение,
      # живой процесс = успешный старт (дальше приложение само закрывается по таймауту).
      - name: Смок-тест запуска Linux-бинаря
        env:
          BUILD_ONLY: ${{ inputs.build_only }}
        run: |
          chmod +x Workspace1C/dist/linux-x64/Workspace1C
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb >/dev/null
          # 124 = timeout (процесс жил все 15 с — успех); 0 — тоже допустимо (штатный выход).
          set +e
          xvfb-run -a timeout 15s ./Workspace1C/dist/linux-x64/Workspace1C
          CODE=$?
          set -e
          if [ "$CODE" = "124" ] || { [ "$CODE" = "0" ] && [ "$BUILD_ONLY" != "true" ]; }; then
            echo "Смок-тест пройден (код $CODE)"
          else
            echo "::error::Linux-бинарь не пережил 15 секунд запуска (код $CODE)"
            exit 1
          fi

      - name: Подготовка asset'а
        run: |
          mkdir -p dist/release
          cp "Workspace1C/dist/linux-x64/Workspace1C" dist/release/Workspace1C-linux-x64
          chmod +x dist/release/Workspace1C-linux-x64
          ls -lh dist/release

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/release/Workspace1C-linux-x64
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [windows, linux]
    if: ${{ !inputs.build_only }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      # Тег может ещё не существовать (workflow_dispatch с новым тегом и явным ref) —
      # тогда берётся ref сборки, а тег создаёт action-gh-release на коммите прогона.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref || env.RELEASE_TAG }}

      - uses: actions/download-artifact@v4
        with:
          path: dist/release
          merge-multiple: true

      - name: Текст релиза
        id: notes
        run: |
          ver="${RELEASE_TAG#v}"
          if [ -f "rel_notes_${ver}.md" ]; then
            cp "rel_notes_${ver}.md" dist/notes.md
          else
            # rel_notes_* удалены как дубль CHANGELOG.md — берём раздел «## [<версия>]»
            # из CHANGELOG.md (до следующего заголовка версии «## [»).
            awk -v hdr="## [${ver}]" '
              index($0, hdr) == 1 { found = 1; next }
              found && /^## \[/ { exit }
              found { print }
            ' CHANGELOG.md > dist/section.md
            if [ -s dist/section.md ]; then
              { echo "# Workspace 1C ${ver}"; echo; \
                echo "Релиз доступен для **Windows** (WPF) и **Linux** (Avalonia)."; \
                cat dist/section.md; echo; \
                echo "Подробности — в [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)."; \
              } > dist/notes.md
            else
              echo "Workspace 1C ${ver}. Подробности — в CHANGELOG.md." > dist/notes.md
            fi
          fi
          echo "version=${ver}" >> "$GITHUB_OUTPUT"
          ls -lh dist/release

      - name: Публикация релиза
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Workspace 1C ${{ steps.notes.outputs.version }}
          body_path: dist/notes.md
          files: |
            dist/release/Workspace1C.exe
            dist/release/Workspace1C-linux-x64
          # Перезаписываем одноимённые asset'ы при повторном прогоне
          # (в action-gh-release@v2 параметр называется overwrite_files).
          overwrite_files: true
          # Тестовый workflow_dispatch (prerelease=true) — prerelease и не latest:
          # обычные пользователи автообновления его не видят (issue #89, запрос 7OH).
          prerelease: ${{ env.IS_PRERELEASE }}
          make_latest: ${{ env.IS_PRERELEASE == 'true' && 'false' || 'true' }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Новость о релизе в Telegram-канал проекта. Шаг выполняется, только если в
      # репозитории задан секрет TELEGRAM_BOT_TOKEN (бот — администратор канала).
      # Канал фиксирован: -1004425443528 (секрет TELEGRAM_CHAT_ID больше не читается,
      # чтобы неверное значение не приводило к HTTP 404 и «тихой» потере новости).
      # Текст — из docs/_telegram_msg_v<версия>.txt (или _telegram_msg_<версия>.txt),
      # иначе первые строки заметок релиза.
      # Тестовые prerelease-сборки в Telegram не анонсируются.
      - name: Новость в Telegram
        if: github.event_name != 'release' && env.IS_PRERELEASE != 'true'
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: '-1004425443528'
        run: |
          if [ -z "$TG_TOKEN" ]; then
            echo "Секрет TELEGRAM_BOT_TOKEN не задан — новость в Telegram не отправляется."
            exit 0
          fi
          chat="$TG_CHAT"
          ver="${{ steps.notes.outputs.version }}"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
          # Файлы _telegram_*.txt в корне перечислены в .gitignore и в CI отсутствуют,
          # поэтому ищем текст новости в docs/ (и как запасной вариант — в корне).
          found=""
          for cand in \
            "docs/_telegram_msg_v${ver}.txt" \
            "docs/_telegram_msg_${ver}.txt" \
            "docs/_telegram_msg_v${ver}.md" \
            "docs/_telegram_msg_${ver}.md" \
            "_telegram_msg_v${ver}.txt" \
            "_telegram_msg_${ver}.txt"; do
            if [ -f "$cand" ]; then found="$cand"; break; fi
          done
          if [ -n "$found" ]; then
            echo "Текст новости: $found"
            cp "$found" dist/tg.txt
          else
            echo "Файл новости не найден — берём первые строки заметок релиза."
            { echo "🚀 Workspace 1C ${ver}"; echo; head -c 3000 dist/notes.md; echo; echo; echo "$url"; } > dist/tg.txt
          fi
          grep -q "$url" dist/tg.txt || { echo; echo "$url"; } >> dist/tg.txt
          code=$(curl -sS -o dist/tg.json -w '%{http_code}' \
            "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${chat}" \
            --data-urlencode "text@dist/tg.txt" \
            --data-urlencode "disable_web_page_preview=false")
          echo "Telegram HTTP $code"
          grep -o '"ok":[a-z]*' dist/tg.json || true
          if [ "$code" != "200" ]; then
            grep -o '"description":"[^"]*"' dist/tg.json || true
            echo "::warning title=Telegram::Новость не отправлена (HTTP $code)"
          fi
