# =============================================================================
# Публикация релиза Workspace 1C в GitHub Releases.
#
# Срабатывает на push тега релиза (например v1.0.0.0 или 1.0.0.0):
#   1) windows — собирает один исполняемый файл Windows (WPF, net10.0-windows,
#      win-x64) скриптом build-windows-single-file.ps1 → Workspace1C.exe;
#   2) linux   — собирает один исполняемый файл Linux (Avalonia, net10.0,
#      linux-x64) скриптом build-linux-single-file.sh → Workspace1C-linux-x64;
#   3) release — создаёт (или обновляет) GitHub Release по тегу и прикрепляет
#      оба файла. Текст релиза берётся из rel_notes_<версия>.md, если он есть.
#
# Имена asset'ов согласованы с автообновлением (Services/GitHubReleaseService.cs):
# Windows ищет «Workspace1C.exe», Linux — «Workspace1C» или имя с «linux-x64».
# =============================================================================
name: Публикация релиза

# В фильтрах тегов GitHub Actions не поддерживает символьные классы ([0-9]),
# поэтому используем glob-шаблоны: v1.0.0.0, 1.0.0.0, 1.0.0 и т.п.
on:
  push:
    tags:
      - 'v*'
      - '*.*.*'
      - '*.*.*.*'
  # Релиз, созданный через веб-интерфейс/API GitHub (тег создаётся вместе с ним).
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег релиза: существующего для пересборки или нового (например v1.0.1.7-test1)'
        required: true
      prerelease:
        description: 'Тестовая сборка: пометить релиз как prerelease (не попадёт в /releases/latest)'
        type: boolean
        default: false
      ref:
        description: 'Необязательно: ветка/коммит для сборки (по умолчанию — ветка запуска)'
        required: false

# Создание/обновление release и загрузка asset требуют записи в репозиторий.
permissions:
  contents: write

# Отменяем незавершённый прогон по тому же тегу, чтобы не плодить гонки.
concurrency:
  group: release-${{ github.event.inputs.tag || github.event.release.tag_name || github.ref }}
  cancel-in-progress: true

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.event.release.tag_name || github.ref_name }}
  # Источник checkout: явный ref из workflow_dispatch (тестовая сборка из ветки),
  # иначе тег релиза, иначе ref запуска (push тега).
  CHECKOUT_REF: ${{ github.event.inputs.ref || github.event.release.tag_name || github.ref }}
  # Тестовая сборка (workflow_dispatch + prerelease=true) публикуется как prerelease:
  # GitHub /releases/latest не отдаёт prerelease, обычные пользователи не затронуты.
  IS_PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease == true }}

jobs:
  windows:
    name: Windows (WPF, single-file)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Установка .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Сборка Windows single-file
        working-directory: Workspace1C
        shell: pwsh
        run: ./build-windows-single-file.ps1 -Configuration Release

      - name: Подготовка asset'а
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/release | Out-Null
          Copy-Item "Workspace1C/dist/win-x64/Workspace1C.exe" dist/release/Workspace1C.exe
          Get-ChildItem dist/release

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/release/Workspace1C.exe
          if-no-files-found: error

  linux:
    name: Linux (Avalonia, single-file)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Установка .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # На реальном Linux скрипт собирает net10.0 + Avalonia (linux-x64),
      # выдаёт dist/linux-x64/Workspace1C — один исполняемый файл.
      - name: Сборка Linux single-file
        working-directory: Workspace1C
        run: ./build-linux-single-file.sh Release

      - name: Подготовка asset'а
        run: |
          mkdir -p dist/release
          cp "Workspace1C/dist/linux-x64/Workspace1C" dist/release/Workspace1C-linux-x64
          chmod +x dist/release/Workspace1C-linux-x64
          ls -lh dist/release

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/release/Workspace1C-linux-x64
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/download-artifact@v4
        with:
          path: dist/release
          merge-multiple: true

      - name: Текст релиза
        id: notes
        run: |
          ver="${RELEASE_TAG#v}"
          if [ -f "rel_notes_${ver}.md" ]; then
            cp "rel_notes_${ver}.md" dist/notes.md
          else
            # rel_notes_* удалены как дубль CHANGELOG.md — берём раздел «## [<версия>]»
            # из CHANGELOG.md (до следующего заголовка версии «## [»).
            awk -v hdr="## [${ver}]" '
              index($0, hdr) == 1 { found = 1; next }
              found && /^## \[/ { exit }
              found { print }
            ' CHANGELOG.md > dist/section.md
            if [ -s dist/section.md ]; then
              { echo "# Workspace 1C ${ver}"; echo; \
                echo "Релиз доступен для **Windows** (WPF) и **Linux** (Avalonia)."; \
                cat dist/section.md; echo; \
                echo "Подробности — в [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)."; \
              } > dist/notes.md
            else
              echo "Workspace 1C ${ver}. Подробности — в CHANGELOG.md." > dist/notes.md
            fi
          fi
          echo "version=${ver}" >> "$GITHUB_OUTPUT"
          ls -lh dist/release

      - name: Публикация релиза
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Workspace 1C ${{ steps.notes.outputs.version }}
          body_path: dist/notes.md
          files: |
            dist/release/Workspace1C.exe
            dist/release/Workspace1C-linux-x64
          # Перезаписываем одноимённые asset'ы при повторном прогоне.
          overwrite: true
          # Тестовый workflow_dispatch (prerelease=true) — prerelease и не latest:
          # обычные пользователи автообновления его не видят (issue #89, запрос 7OH).
          prerelease: ${{ env.IS_PRERELEASE }}
          make_latest: ${{ env.IS_PRERELEASE == 'true' && 'false' || 'true' }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Новость о релизе в Telegram-канал проекта. Шаг выполняется, только если в
      # репозитории задан секрет TELEGRAM_BOT_TOKEN (бот — администратор канала).
      # Канал по умолчанию -1004425443528, переопределяется секретом TELEGRAM_CHAT_ID.
      # Текст — из _telegram_msg_v1000NN.txt (1.0.0.NN), иначе первые строки заметок.
      # Тестовые prerelease-сборки в Telegram не анонсируются.
      - name: Новость в Telegram
        if: github.event_name != 'release' && env.IS_PRERELEASE != 'true'
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TG_TOKEN" ]; then
            echo "Секрет TELEGRAM_BOT_TOKEN не задан — новость в Telegram не отправляется."
            exit 0
          fi
          chat="${TG_CHAT:--1004425443528}"
          ver="${{ steps.notes.outputs.version }}"
          head3="${ver%.*}"
          msg="_telegram_msg_v${head3//./}0${ver##*.}.txt"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
          if [ -f "$msg" ]; then
            cp "$msg" dist/tg.txt
          else
            { echo "🚀 Workspace 1C ${ver}"; echo; head -c 3000 dist/notes.md; echo; echo; echo "$url"; } > dist/tg.txt
          fi
          grep -q "$url" dist/tg.txt || { echo; echo "$url"; } >> dist/tg.txt
          code=$(curl -sS -o dist/tg.json -w '%{http_code}' \
            "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${chat}" \
            --data-urlencode "text@dist/tg.txt" \
            --data-urlencode "disable_web_page_preview=false")
          echo "Telegram HTTP $code"
          grep -o '"ok":[a-z]*' dist/tg.json || true
          if [ "$code" != "200" ]; then
            grep -o '"description":"[^"]*"' dist/tg.json || true
            echo "::warning title=Telegram::Новость не отправлена (HTTP $code)"
          fi
